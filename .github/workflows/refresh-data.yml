name: Refrescar datos cacheados (Scopus + SCImago)

on:
  schedule:
    # Día 5 de cada mes a las 08:00 UTC — el Scopus Source List de Elsevier se
    # publica mensualmente; dejamos unos días de margen tras el cambio de mes.
    - cron: "0 8 5 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Refrescar Scopus Source List y dataset SCImago
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_cached_data.py

      - name: Commitear manifiesto si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && echo "Sin cambios en el manifiesto." || git commit -m "Refresh automático mensual de datos fuente"
          git push
