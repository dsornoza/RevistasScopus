services:
  - type: web
    name: revistas-scopus-checker
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      PYTHONPATH=src python -c "from sources import scopus_list, scimago; scopus_list.download_source_list(); scimago.download_dataset()"
    # 1 worker: el plan free de Render tiene 512MB de RAM y el dataset de
    # SCImago (~700k filas) queda cacheado en memoria por worker — con 2
    # workers duplicábamos ese consumo y nos acercábamos al límite.
    startCommand: gunicorn wsgi:app --workers 1 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
